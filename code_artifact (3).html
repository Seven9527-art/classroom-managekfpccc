        // 5: 潮酷企鵝
        return `
          <svg viewBox="0 0 150 148" width="100%" height="100%">
            ${shadowAndFeet}
            <ellipse cx="34" cy="70" rx="11" ry="22" transform="rotate(-38 34 70)" fill="#7790c7" stroke="#070e18" stroke-width="2.6"/>
            <ellipse cx="112" cy="94" rx="10" ry="19" transform="rotate(-14 112 94)" fill="#465b8c" stroke="#070e18" stroke-width="2.6"/>
            ${baseBody}
            <path d="M67 75 Q75 70 83 75 Q75 84 67 75 Z" fill="#ffc44d" stroke="#070e18" stroke-width="2.2"/>
            <rect x="46" y="55" width="26" height="18" rx="6" fill="#182436" stroke="#070e18" stroke-width="2.4"/>
            <rect x="78" y="55" width="26" height="18" rx="6" fill="#182436" stroke="#070e18" stroke-width="2.4"/>
            <line x1="72" y1="62" x2="78" y2="62" stroke="#070e18" stroke-width="3.4"/>
            <path d="M51 60 L61 60 M83 60 L93 60" stroke="#64f0ff" stroke-width="2.6" stroke-linecap="round"/>
          </svg>
        `;
      }

      /* Cel-Shaded Fish SVG */
      const FISH_COLORS = [
        { body: '#ff9fb2', tail: '#e36f86' },
        { body: '#70e8ff', tail: '#33b5d4' },
        { body: '#ffc166', tail: '#e88b2c' }
      ];

      const FISH_POSITIONS = [
        { left: '4%',  bottom: '4px',  rot: -10, flip: false },
        { right: '4%', bottom: '4px',  rot: 8,   flip: true  },
        { left: '12%', bottom: '20px', rot: 12,  flip: false },
        { right: '10%',bottom: '22px', rot: -12, flip: true  },
        { left: '2%',  bottom: '38px', rot: -6,  flip: false },
        { right: '2%', bottom: '40px', rot: 10,  flip: true  },
        { left: '14%', bottom: '56px', rot: 14,  flip: false },
        { right: '12%',bottom: '58px', rot: -14, flip: true  },
        { left: '4%',  bottom: '74px', rot: -8,  flip: false },
        { right: '4%', bottom: '76px', rot: 8,   flip: true  }
      ];

      function createFishHTML(index) {
        const col = FISH_COLORS[index % FISH_COLORS.length];
        const pos = FISH_POSITIONS[index % FISH_POSITIONS.length];
        const styleParts = [`bottom:${pos.bottom}`];
        if (pos.left) styleParts.push(`left:${pos.left}`);
        if (pos.right) styleParts.push(`right:${pos.right}`);
        const scaleX = pos.flip ? -1 : 1;
        return `
          <div class="fish-item" style="${styleParts.join(';')}">
            <svg viewBox="0 0 38 26" width="100%" height="100%" style="transform: scaleX(${scaleX}) rotate(${pos.rot}deg);">
              <ellipse cx="15" cy="13" rx="11" ry="7.5" fill="${col.body}" stroke="#070e18" stroke-width="2.2"/>
              <path d="M24 13 L34 6 L33 20 Z" fill="${col.tail}" stroke="#070e18" stroke-width="2.2" stroke-linejoin="round"/>
              <circle cx="10" cy="11.5" r="2" fill="#070e18"/>
              <path d="M13 8.5 Q18 9 20 11" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
        `;
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      /* ==================== RENDER FUNCTIONS ==================== */
      function renderModes() {
        document.querySelectorAll('.mode-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === state.mode);
        });
      }

      function renderTasks() {
        const list = document.getElementById('task-list');
        const items = state.tasks[state.mode] || [];
        if (items.length === 0) {
          list.innerHTML = `<li style="text-align:center; padding:24px; color:#adc4de; font-weight:700;">暫無任務，請按右上角「⚙️ 設定」新增。</li>`;
          return;
        }
        list.innerHTML = items.map((item, idx) => `
          <li class="task-item ${item.done ? 'checked' : ''} tint-${idx % 4}" data-task-id="${escapeHtml(item.id)}" role="checkbox" aria-checked="${item.done}" tabindex="0">
            <span class="task-checkbox" aria-hidden="true">
              <svg class="task-check-svg" viewBox="0 0 24 24">
                <polyline points="4 13 9.5 18.5 20 6.5"></polyline>
              </svg>
            </span>
            <span class="task-label">${escapeHtml(item.text)}</span>
          </li>
        `).join('');
      }

      function renderStudents() {
        const grid = document.getElementById('student-grid');
        const markedSet = new Set(state.markedStudents);
        let html = '';
        for (let i = 1; i <= state.studentCount; i++) {
          const isMarked = markedSet.has(i);
          html += `<button type="button" class="btn-3d student-tile ${isMarked ? 'marked' : ''}" data-student="${i}" aria-pressed="${isMarked}">${i}</button>`;
        }
        grid.innerHTML = html;
      }

      function renderGroups() {
        const row = document.getElementById('groups-row');
        row.innerHTML = state.groups.map((g, idx) => {
          const isCelebrating = Boolean(celebratingGroups[idx]);
          let fishHTML = '';
          for (let f = 0; f < g.score; f++) {
            fishHTML += createFishHTML(f);
          }
          return `
            <div class="group-slot" data-group-idx="${idx}">
              <div class="group-arch" aria-hidden="true"></div>
              <div class="group-name-tag" title="${escapeHtml(g.name)}">${escapeHtml(g.name)}</div>
              <div class="group-stage">
                <div class="fish-pile">${fishHTML}</div>
                <div class="group-penguin-wrap ${isCelebrating ? 'celebrating' : ''}">
                  ${getGroupPenguinSVG(idx)}
                </div>
                ${isCelebrating ? '<div class="group-celebrate-banner">🎉 滿分達標！</div>' : ''}
              </div>
              <div class="group-footer">
                <div class="score-pill">${g.score} / 10</div>
                <div class="score-btn-group">
                  <button type="button" class="btn-3d plus-btn" data-add-group="${idx}" aria-label="${escapeHtml(g.name)}加一分">+ 1</button>
                  <button type="button" class="btn-3d minus-btn" data-sub-group="${idx}" title="扣回 1 分" aria-label="${escapeHtml(g.name)}減一分">−</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      function renderQuietPenguin(isAwake) {
        const visual = document.getElementById('quiet-penguin-visual');
        visual.innerHTML = getQuietPenguinSVG(isAwake);
      }

      function buildDbBars() {
        const container = document.getElementById('db-bars');
        const heights = [10, 11, 13, 14, 16, 17, 19, 20, 22, 23, 24, 25, 25, 26];
        container.innerHTML = heights.map((h, i) => `<div class="db-bar" data-bar="${i}" style="height:${h}px"></div>`).join('');
      }

      function updateDbBars(level) {
        const bars = document.querySelectorAll('#db-bars .db-bar');
        const litCount = Math.round((level / 100) * bars.length);
        bars.forEach((bar, i) => {
          bar.classList.remove('lit-green', 'lit-yellow', 'lit-orange', 'lit-red');
          if (i < litCount) {
            if (i < 6) bar.classList.add('lit-green');
            else if (i < 9) bar.classList.add('lit-yellow');
            else if (i < 12) bar.classList.add('lit-orange');
            else bar.classList.add('lit-red');
          }
        });
      }

      /* ==================== QUIET CHALLENGE AUDIO MONITOR ==================== */
      let micActive = false;
      let micStream = null;
      let micAudioCtx = null;
      let micAnalyser = null;
      let micSilentGain = null;
      let micRafId = null;
      let selectedMicId = '';
      let penguinAwake = false;
      let lastNoisyAt = 0;
      let simVolume = 0;

      async function populateMicDevices() {
        const select = document.getElementById('mic-device-select');
        if (!select || !navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const audioInputs = devices.filter(d => d.kind === 'audioinput');
          const prev = selectedMicId || select.value;
          select.innerHTML = '<option value="">系統預設咪高峰</option>' +
            audioInputs.map((d, i) => `<option value="${escapeHtml(d.deviceId)}">${escapeHtml(d.label || ('咪高峰 ' + (i + 1)))}</option>`).join('');
          if (prev) select.value = prev;
        } catch (_) {}
      }

      function setQuietState(isNoisyNow, currentLevel = 0) {
        const card = document.getElementById('quiet-card');
        const badge = document.getElementById('quiet-status-badge');
        const now = Date.now();

        if (isNoisyNow) {
          lastNoisyAt = now;
          if (!penguinAwake) {
            penguinAwake = true;
            card.classList.add('noisy');
            renderQuietPenguin(true);
            playPopSound(320);
            const rect = card.getBoundingClientRect();
            launchShockwaveAt(rect.left + rect.width / 2, rect.top + rect.height * 0.45);
          }
          badge.textContent = `太嘈啦 (${currentLevel})`;
        } else if (penguinAwake && now - lastNoisyAt >= 2000) {
          penguinAwake = false;
          card.classList.remove('noisy');
          badge.textContent = micActive ? `監測中 (${currentLevel})` : (simVolume > 0 ? `模擬 (${currentLevel})` : '待命');
          renderQuietPenguin(false);
        } else if (!penguinAwake) {
          badge.textContent = micActive ? `監測中 (${currentLevel})` : (simVolume > 0 ? `模擬 (${currentLevel})` : '待命');
        }
      }

      function stopMicMonitor() {
        micActive = false;
        if (micRafId) {
          cancelAnimationFrame(micRafId);
          micRafId = null;
        }
        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
        }
        if (micSilentGain) {
          try { micSilentGain.disconnect(); } catch (_) {}
          micSilentGain = null;
        }
        if (micAudioCtx) {
          micAudioCtx.close().catch(() => {});
          micAudioCtx = null;
        }
        micAnalyser = null;
        const btn = document.getElementById('quiet-toggle-btn');
        btn.textContent = '開始';
        btn.classList.remove('listening');
        if (simVolume === 0) {
          updateDbBars(0);
          const badge = document.getElementById('quiet-status-badge');
          if (!penguinAwake) badge.textContent = '待命';
        }
      }

      async function startMicMonitor() {
        const notice = document.getElementById('mic-notice');
        notice.classList.remove('visible');

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          notice.textContent = '此瀏覽器或網址不支援咪高峰（需使用 https:// 或 localhost），可改用設定內的模擬滑桿。';
          notice.classList.add('visible');
          showToast('此瀏覽器不支援咪高峰收音，可使用設定中的模擬滑桿。');
          return;
        }

        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) {
          notice.textContent = '瀏覽器不支援 Web Audio API，請改用 Chrome 或 Edge。';
          notice.classList.add('visible');
          return;
        }

        try {
          micAudioCtx = new Ctx();
          if (micAudioCtx.state === 'suspended') {
            await micAudioCtx.resume();
          }

          const audioConstraint = selectedMicId
            ? { deviceId: { exact: selectedMicId } }
            : true;
          micStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraint, video: false });
          populateMicDevices();

          if (micAudioCtx.state === 'suspended') {
            await micAudioCtx.resume();
          }

          const tracks = micStream.getAudioTracks();
          const trackLabel = tracks[0] ? tracks[0].label : '';
          if (tracks[0] && tracks[0].muted) {
            notice.textContent = `已連接「${trackLabel || '咪高峰'}」，但系統顯示裝置處於靜音狀態，請檢查電腦或外置咪高峰靜音鍵。`;
            notice.classList.add('visible');
          } else if (trackLabel) {
            showToast(`已連接咪高峰：${trackLabel}`);
          }

          const source = micAudioCtx.createMediaStreamSource(micStream);
          micAnalyser = micAudioCtx.createAnalyser();
          micAnalyser.fftSize = 1024;
          micAnalyser.smoothingTimeConstant = 0.72;

          micSilentGain = micAudioCtx.createGain();
          micSilentGain.gain.value = 0.0001;
          source.connect(micAnalyser);
          micAnalyser.connect(micSilentGain);
          micSilentGain.connect(micAudioCtx.destination);

          micActive = true;
          const btn = document.getElementById('quiet-toggle-btn');
          btn.textContent = '停止';
          btn.classList.add('listening');
          document.getElementById('quiet-status-badge').textContent = '監測中 (0)';

          const timeData = new Float32Array(micAnalyser.fftSize);
          const freqData = new Uint8Array(micAnalyser.frequencyBinCount);
          let smoothedLevel = 0;

          function loop() {
            if (!micActive || !micAnalyser) return;
            let rms = 0;
            if (typeof micAnalyser.getFloatTimeDomainData === 'function') {
              micAnalyser.getFloatTimeDomainData(timeData);
              let sumSq = 0;
              for (let i = 0; i < timeData.length; i++) {
                sumSq += timeData[i] * timeData[i];
              }
              rms = Math.sqrt(sumSq / timeData.length);
            }
            micAnalyser.getByteFrequencyData(freqData);
            let freqSum = 0;
            for (let i = 0; i < freqData.length; i++) {
              freqSum += freqData[i];
            }
            const freqAvg = freqSum / freqData.length;

            const db = rms > 0.0001 ? 20 * Math.log10(rms) : -80;
            const dbScore = Math.max(0, Math.min(100, ((db + 58) / 46) * 100));
            const freqScore = Math.max(0, Math.min(100, freqAvg * 1.45));
            const rawLevel = Math.round(Math.max(dbScore, freqScore));

            smoothedLevel = Math.round(smoothedLevel * 0.55 + rawLevel * 0.45);
            const effectiveLevel = Math.max(smoothedLevel, simVolume);

            updateDbBars(effectiveLevel);
            setQuietState(effectiveLevel >= state.noiseThreshold, effectiveLevel);
            micRafId = requestAnimationFrame(loop);
          }
          loop();
        } catch (err) {
          const reasonMap = {
            NotAllowedError: '咪高峰權限被拒絕，請檢查瀏覽器網址列鎖頭圖示及系統私隱設定。',
            PermissionDeniedError: '咪高峰權限被拒絕，請檢查瀏覽器網址列鎖頭圖示及系統私隱設定。',
            NotFoundError: '找不到任何可用的咪高峰裝置，請確認已接駁咪高峰。',
            NotReadableError: '咪高峰正被其他程式佔用或無法讀取，請關閉其他錄音程式後重試。'
          };
          notice.textContent = reasonMap[err && err.name] || `無法啟動咪高峰（${(err && err.name) || '未知錯誤'}），可使用設定中的模擬滑桿測試。`;
          notice.classList.add('visible');
          showToast(notice.textContent);
          stopMicMonitor();
        }
      }

      setInterval(() => {
        if (!micActive && (simVolume > 0 || penguinAwake)) {
          updateDbBars(simVolume);
          setQuietState(simVolume >= state.noiseThreshold, simVolume);
        }
      }, 150);

      /* ==================== CLOCK & COUNTDOWN TIMER ==================== */
      let timerMode = false;
      let timerRunning = false;
      let timerRemainingSec = 0;
      let timerFinished = false;
      let timerInterval = null;

      function formatClockTime() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        return `${hh}:${mm}`;
      }

      function formatTimerSec(sec) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      function updateClockUI() {
        const display = document.getElementById('clock-display');
        const pill = document.getElementById('clock-btn');
        if (timerMode) {
          display.textContent = formatTimerSec(timerRemainingSec);
          pill.classList.toggle('timer-running', timerRunning && !timerFinished);
          pill.classList.toggle('timer-finished', timerFinished);
        } else {
          display.textContent = formatClockTime();
          pill.classList.remove('timer-running', 'timer-finished');
        }
      }

      function startCountdown(minutes) {
        const mins = Math.max(1, Math.min(120, Number(minutes) || 1));
        clearInterval(timerInterval);
        timerMode = true;
        timerRunning = true;
        timerFinished = false;
        timerRemainingSec = Math.round(mins * 60);
        updateClockUI();

        timerInterval = setInterval(() => {
          if (!timerRunning) return;
          if (timerRemainingSec > 0) {
            timerRemainingSec--;
            updateClockUI();
          }
          if (timerRemainingSec <= 0) {
            timerRunning = false;
            timerFinished = true;
            clearInterval(timerInterval);
            updateClockUI();
            playGentleChime();
            showToast('⏰ 倒數計時結束！');
          }
        }, 1000);
      }

      function resetCountdownToClock() {
        clearInterval(timerInterval);
        timerMode = false;
        timerRunning = false;
        timerFinished = false;
        timerRemainingSec = 0;
        updateClockUI();
      }

      setInterval(() => {
        if (!timerMode) updateClockUI();
      }, 1000);

      /* ==================== AMBIENT SPACE STARS + WARM/CYAN MOTES ==================== */
      const ambientCanvas = document.getElementById('ambient-canvas');
      const ambientCtx = ambientCanvas.getContext('2d');
      let ambientMotes = [];
      let bgStars = [];

      function initAmbientCanvas() {
        ambientCanvas.width = window.innerWidth;
        ambientCanvas.height = window.innerHeight;
        const count = Math.min(54, Math.max(26, Math.floor(window.innerWidth / 30)));
        ambientMotes = [];
        for (let i = 0; i < count; i++) {
          ambientMotes.push({
            x: Math.random() * ambientCanvas.width,
            y: Math.random() * ambientCanvas.height,
            r: 1.8 + Math.random() * 4.2,
            vx: -0.22 - Math.random() * 0.35,
            vy: -0.08 + Math.random() * 0.24,
            phase: Math.random() * Math.PI * 2,
            isAmber: Math.random() > 0.5
          });
        }
        bgStars = [];
        for (let i = 0; i < 60; i++) {
          bgStars.push({
            x: Math.random() * ambientCanvas.width,
            y: Math.random() * ambientCanvas.height * 0.72,
            r: 0.8 + Math.random() * 1.5,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      function animateAmbient() {
        ambientCtx.clearRect(0, 0, ambientCanvas.width, ambientCanvas.height);
        const t = Date.now() * 0.0016;

        for (let i = 0; i < bgStars.length; i++) {
          const st = bgStars[i];
          const a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * 2 + st.phase));
          ambientCtx.fillStyle = `rgba(218, 245, 255, ${a})`;
          ambientCtx.beginPath();
          ambientCtx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
          ambientCtx.fill();
        }

        for (let i = 0; i < ambientMotes.length; i++) {
          const m = ambientMotes[i];
          m.x += m.vx + Math.sin(t + m.phase) * 0.2;
          m.y += m.vy;
          if (m.x < -12) m.x = ambientCanvas.width + 12;
          if (m.y > ambientCanvas.height + 12) m.y = -12;
          if (m.y < -12) m.y = ambientCanvas.height + 12;

          const alpha = 0.26 + 0.42 * (0.5 + 0.5 * Math.sin(t * 1.8 + m.phase));
          const grad = ambientCtx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 2.8);
          if (m.isAmber) {
            grad.addColorStop(0, `rgba(255, 198, 92, ${alpha})`);
            grad.addColorStop(1, 'rgba(255, 198, 92, 0)');
          } else {
            grad.addColorStop(0, `rgba(100, 240, 255, ${alpha})`);
            grad.addColorStop(1, 'rgba(100, 240, 255, 0)');
          }
          ambientCtx.fillStyle = grad;
          ambientCtx.beginPath();
          ambientCtx.arc(m.x, m.y, m.r * 2.8, 0, Math.PI * 2);
          ambientCtx.fill();
        }
        requestAnimationFrame(animateAmbient);
      }

      /* ==================== INTERACTIVE ANIME FX & CONFETTI ENGINE ==================== */
      const confettiCanvas = document.getElementById('confetti-canvas');
      const confettiCtx = confettiCanvas.getContext('2d');
      let fxParticles = [];
      let fxRings = [];
      let fxRaf = null;

      function resizeAllCanvases() {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
        initAmbientCanvas();
      }
      window.addEventListener('resize', resizeAllCanvases);
      resizeAllCanvases();
      animateAmbient();

      function drawStar(ctx, r) {
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          const a = (i * Math.PI) / 2;
          ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
          const b = a + Math.PI / 4;
          ctx.lineTo(Math.cos(b) * r * 0.32, Math.sin(b) * r * 0.32);
        }
        ctx.closePath();
        ctx.fill();
      }

      function launchSparkleBurst(x, y, palette) {
        const colors = palette || ['#ffca52', '#64f0ff', '#ff9eb5', '#ffffff'];
        for (let i = 0; i < 20; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2.4 + Math.random() * 5.6;
          fxParticles.push({
            type: i % 2 === 0 ? 'star' : 'drop',
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1.6,
            size: 5 + Math.random() * 6,
            color: colors[i % colors.length],
            rot: Math.random() * 360,
            vRot: (Math.random() - 0.5) * 10,
            gravity: 0.14,
            life: 1,
            decay: 0.024 + Math.random() * 0.014
          });
        }
        fxRings.push({ x, y, r: 8, maxR: 52, color: colors[0], life: 0.9 });
        if (!fxRaf) animateFX();
      }

      function launchShockwaveAt(x, y) {
        fxRings.push({ x, y, r: 16, maxR: 128, color: '#ff5652', life: 0.95 });
        fxRings.push({ x, y, r: 8, maxR: 92, color: '#ffbe44', life: 0.85 });
        for (let i = 0; i < 16; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 3.5 + Math.random() * 5.8;
          fxParticles.push({
            type: 'star',
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 6 + Math.random() * 5,
            color: i % 2 === 0 ? '#ff5652' : '#ffbe44',
            rot: 0,
            vRot: 8,
            gravity: 0.06,
            life: 1,
            decay: 0.028
          });
        }
        if (!fxRaf) animateFX();
      }

      function launchConfettiAt(originX, originY) {
        const colors = ['#ff6b63', '#ffd452', '#64f0ff', '#8ae68c', '#ff9eb5', '#ff9f43'];
        fxRings.push({ x: originX, y: originY, r: 14, maxR: 136, color: '#64f0ff', life: 1 });
        for (let i = 0; i < 88; i++) {
          const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.9;
          const speed = 5.5 + Math.random() * 11;
          fxParticles.push({
            type: i % 3 === 0 ? 'star' : 'ribbon',
            x: originX,
            y: originY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2.6,
            size: 6 + Math.random() * 7,
            color: colors[i % colors.length],
            rot: Math.random() * 360,
            vRot: (Math.random() - 0.5) * 14,
            gravity: 0.22,
            life: 1,
            decay: 0.009 + Math.random() * 0.005
          });
        }
        if (!fxRaf) animateFX();
      }

      function animateFX() {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

        fxRings = fxRings.filter(ring => ring.life > 0.03);
        fxRings.forEach(ring => {
          ring.r += (ring.maxR - ring.r) * 0.14;
          ring.life -= 0.035;
          confettiCtx.save();
          confettiCtx.globalAlpha = Math.max(0, ring.life);
          confettiCtx.strokeStyle = ring.color;
          confettiCtx.lineWidth = 3.4;
          confettiCtx.beginPath();
          confettiCtx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);
          confettiCtx.stroke();
          confettiCtx.restore();
        });

        fxParticles = fxParticles.filter(p => p.life > 0.02);
        fxParticles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.vx *= 0.985;
          p.rot += p.vRot;
          p.life -= p.decay;
          confettiCtx.save();
          confettiCtx.globalAlpha = Math.max(0, p.life);
          confettiCtx.translate(p.x, p.y);
          confettiCtx.rotate((p.rot * Math.PI) / 180);
          confettiCtx.fillStyle = p.color;
          if (p.type === 'star') {
            drawStar(confettiCtx, p.size);
          } else if (p.type === 'drop') {
            confettiCtx.beginPath();
            confettiCtx.arc(0, 0, p.size * 0.45, 0, Math.PI * 2);
            confettiCtx.fill();
          } else {
            confettiCtx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.65);
          }
          confettiCtx.restore();
        });

        if (fxParticles.length > 0 || fxRings.length > 0) {
          fxRaf = requestAnimationFrame(animateFX);
        } else {
          fxRaf = null;
        }
      }

      /* ==================== GROUP SCORING LOGIC ==================== */
      function addGroupScore(idx, btnEl) {
        if (celebratingGroups[idx]) return;
        const g = state.groups[idx];
        if (!g || g.score >= 10) return;
        g.score += 1;
        saveState();
        renderGroups();
        playPopSound(520 + g.score * 38);

        const rect = btnEl ? btnEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight * 0.75, width: 0 };
        const cx = rect.left + rect.width / 2;
        const cy = rect.top - 42;

        if (g.score >= 10) {
          celebratingGroups[idx] = true;
          renderGroups();
          playCheerSound();
          launchConfettiAt(cx, cy);
          showToast(`🎉 恭喜「${g.name}」滿 10 分！3 秒後自動展開新一輪！`);

          setTimeout(() => {
            state.groups[idx].score = 0;
            delete celebratingGroups[idx];
            saveState();
            renderGroups();
          }, 3000);
        } else {
          launchSparkleBurst(cx, cy, ['#ffca52', '#64f0ff', '#ff9eb5', '#ffffff']);
        }
      }

      function subGroupScore(idx) {
        if (celebratingGroups[idx]) return;
        const g = state.groups[idx];
        if (!g || g.score <= 0) return;
        g.score -= 1;
        saveState();
        renderGroups();
        playPopSound(360);
      }

      /* ==================== SETTINGS MODAL RENDER & HANDLERS ==================== */
      function openModal(id) {
        const el = document.getElementById(id);
        if (el) el.classList.add('open');
      }

      function closeModal(id) {
        const el = document.getElementById(id);
        if (el) el.classList.remove('open');
      }

      function renderTaskEditor() {
        document.querySelectorAll('.task-mode-switch').forEach(btn => {
          const active = btn.dataset.editMode === editingTaskMode;
          btn.classList.toggle('neutral', !active);
        });
        const container = document.getElementById('task-editor-list');
        const list = state.tasks[editingTaskMode] || [];
        container.innerHTML = list.map((item, idx) => `
          <div class="task-edit-row">
            <input type="text" class="felt-input task-edit-input" data-edit-idx="${idx}" value="${escapeHtml(item.text)}" />
            <button type="button" class="btn-3d small-action-btn danger task-delete-btn" data-del-idx="${idx}">刪除</button>
          </div>
        `).join('');
      }

      function renderClassEditor() {
        const range = document.getElementById('student-count-range');
        const val = document.getElementById('student-count-val');
        range.value = state.studentCount;
        val.textContent = `${state.studentCount} 人`;

        const grid = document.getElementById('group-name-inputs');
        grid.innerHTML = state.groups.map((g, idx) => `
          <div>
            <label class="form-label" style="margin-bottom:4px;" for="gname-${idx}">組別 ${idx + 1}</label>
            <input id="gname-${idx}" type="text" class="felt-input group-name-edit" data-gidx="${idx}" value="${escapeHtml(g.name)}" maxlength="12" />
          </div>
        `).join('');
      }

      function renderQuietEditor() {
        document.getElementById('noise-threshold-range').value = state.noiseThreshold;
        document.getElementById('noise-threshold-val').textContent = String(state.noiseThreshold);
        document.getElementById('sim-volume-range').value = simVolume;
        document.getElementById('sim-volume-val').textContent = String(simVolume);
      }

      function renderImageEditor() {
        const slots = [
          { key: 'quietSleep', label: '安靜挑戰：睡覺企鵝' },
          { key: 'quietAwake', label: '安靜挑戰：驚醒企鵝' },
          { key: 'group0', label: `${state.groups[0].name} 企鵝` },
          { key: 'group1', label: `${state.groups[1].name} 企鵝` },
          { key: 'group2', label: `${state.groups[2].name} 企鵝` },
          { key: 'group3', label: `${state.groups[3].name} 企鵝` },
          { key: 'group4', label: `${state.groups[4].name} 企鵝` },
          { key: 'group5', label: `${state.groups[5].name} 企鵝` }
        ];
        const grid = document.getElementById('custom-image-grid');
        grid.innerHTML = slots.map(slot => {
          const dataUrl = state.customImages[slot.key];
          return `
            <div class="upload-card">
              <div class="upload-preview">
                ${dataUrl ? `<img src="${dataUrl}" alt="${escapeHtml(slot.label)}" />` : '🐧'}
              </div>
              <div class="upload-info">
                <div class="upload-title">${escapeHtml(slot.label)}</div>
                <div class="upload-actions">
                  <label class="btn-3d small-action-btn" style="padding:4px 10px; font-size:12px; cursor:pointer;">
                    上傳圖片
                    <input type="file" accept="image/*" data-img-key="${slot.key}" style="display:none;" />
                  </label>
                  ${dataUrl ? `<button type="button" class="btn-3d small-action-btn neutral" style="padding:4px 8px; font-size:12px;" data-clear-img="${slot.key}">還原</button>` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      function compressImageFile(file, callback) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = new Image();
          img.onload = function () {
            const maxDim = 260;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              const scale = maxDim / Math.max(w, h);
              w = Math.round(w * scale);
              h = Math.round(h * scale);
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            callback(canvas.toDataURL('image/png', 0.85));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      /* ==================== EVENT LISTENERS ==================== */
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.mode = btn.dataset.mode;
          saveState();
          renderModes();
          renderTasks();
          playPopSound(600);
        });
      });

      const taskListEl = document.getElementById('task-list');
      function handleTaskToggle(li) {
        const id = li.dataset.taskId;
        const list = state.tasks[state.mode];
        const target = list.find(t => t.id === id);
        if (!target) return;
        target.done = !target.done;
        if (target.done) {
          const rect = li.getBoundingClientRect();
          launchSparkleBurst(rect.left + 26, rect.top + rect.height / 2, ['#ffca52', '#64f0ff', '#ffffff']);
        }
        saveState();
        renderTasks();
        playPopSound(target.done ? 680 : 420);
      }
      taskListEl.addEventListener('click', e => {
        const li = e.target.closest('.task-item');
        if (li) handleTaskToggle(li);
      });
      taskListEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          const li = e.target.closest('.task-item');
          if (li) {
            e.preventDefault();
            handleTaskToggle(li);
          }
        }
      });

      document.getElementById('quiet-toggle-btn').addEventListener('click', () => {
        if (micActive) stopMicMonitor();
        else startMicMonitor();
      });

      document.getElementById('student-grid').addEventListener('click', e => {
        const btn = e.target.closest('.student-tile');
        if (!btn) return;
        const num = Number(btn.dataset.student);
        const idx = state.markedStudents.indexOf(num);
        if (idx >= 0) {
          state.markedStudents.splice(idx, 1);
          playPopSound(440);
        } else {
          state.markedStudents.push(num);
          playPopSound(340);
        }
        saveState();
        renderStudents();
      });

      document.getElementById('clear-marks-btn').addEventListener('click', () => {
        state.markedStudents = [];
        saveState();
        renderStudents();
        playPopSound(660);
        showToast('已清除所有摘名標記');
      });

      document.getElementById('groups-row').addEventListener('click', e => {
        const addBtn = e.target.closest('[data-add-group]');
        if (addBtn) {
          addGroupScore(Number(addBtn.dataset.addGroup), addBtn);
          return;
        }
        const subBtn = e.target.closest('[data-sub-group]');
        if (subBtn) {
          subGroupScore(Number(subBtn.dataset.subGroup));
        }
      });

      document.getElementById('clock-btn').addEventListener('click', () => {
        if (timerFinished) {
          resetCountdownToClock();
          return;
        }
        openModal('timer-modal');
      });

      document.querySelectorAll('.timer-preset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const mins = Number(btn.dataset.timerMin);
          document.getElementById('timer-custom-input').value = mins;
          startCountdown(mins);
          closeModal('timer-modal');
          showToast(`⏱️ 已啟動 ${mins} 分鐘倒數`);
        });
      });

      document.getElementById('timer-start-btn').addEventListener('click', () => {
        const mins = Number(document.getElementById('timer-custom-input').value);
        if (timerMode && !timerRunning && timerRemainingSec > 0 && !timerFinished) {
          timerRunning = true;
          updateClockUI();
          closeModal('timer-modal');
          return;
        }
        startCountdown(mins);
        closeModal('timer-modal');
        showToast(`⏱️ 已啟動 ${Math.max(1, Math.min(120, mins || 1))} 分鐘倒數`);
      });

      document.getElementById('timer-pause-btn').addEventListener('click', () => {
        if (timerMode && !timerFinished) {
          timerRunning = !timerRunning;
          updateClockUI();
          showToast(timerRunning ? '已繼續倒數' : '已暫停倒數');
        }
      });

      document.getElementById('timer-reset-btn').addEventListener('click', () => {
        resetCountdownToClock();
        closeModal('timer-modal');
        showToast('已返回系統時鐘');
      });

      document.getElementById('settings-btn').addEventListener('click', () => {
        editingTaskMode = state.mode;
        confirmResetScores = false;
        confirmResetAll = false;
        document.getElementById('reset-scores-btn').textContent = '重設所有分數';
        document.getElementById('reset-all-btn').textContent = '恢復預設設定';
        renderTaskEditor();
        renderClassEditor();
        renderQuietEditor();
        populateMicDevices();
        renderImageEditor();
        openModal('settings-modal');
      });

      document.querySelectorAll('.modal-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.dataset.stab;
          document.querySelectorAll('.modal-tab-btn').forEach(b => b.classList.toggle('active', b === btn));
          document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'stab-' + target));
        });
      });

      document.querySelectorAll('[data-close-modal]').forEach(btn => {
        btn.addEventListener('click', () => closeModal(btn.dataset.closeModal));
      });
      document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
        backdrop.addEventListener('click', e => {
          if (e.target === backdrop) closeModal(backdrop.id);
        });
      });

      document.querySelectorAll('.task-mode-switch').forEach(btn => {
        btn.addEventListener('click', () => {
          editingTaskMode = btn.dataset.editMode;
          renderTaskEditor();
        });
      });

      document.getElementById('task-editor-list').addEventListener('input', e => {
        if (e.target.classList.contains('task-edit-input')) {
          const idx = Number(e.target.dataset.editIdx);
          if (state.tasks[editingTaskMode][idx]) {
            state.tasks[editingTaskMode][idx].text = e.target.value;
            saveState();
            if (editingTaskMode === state.mode) renderTasks();
          }
        }
      });

      document.getElementById('task-editor-list').addEventListener('click', e => {
        const delBtn = e.target.closest('.task-delete-btn');
        if (!delBtn) return;
        const idx = Number(delBtn.dataset.delIdx);
        state.tasks[editingTaskMode].splice(idx, 1);
        saveState();
        renderTaskEditor();
        if (editingTaskMode === state.mode) renderTasks();
      });

      document.getElementById('add-task-btn').addEventListener('click', () => {
        const input = document.getElementById('new-task-input');
        const text = input.value.trim();
        if (!text) return;
        state.tasks[editingTaskMode].push({
          id: 't_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          text,
          done: false
        });
        input.value = '';
        saveState();
        renderTaskEditor();
        if (editingTaskMode === state.mode) renderTasks();
      });

      document.getElementById('student-count-range').addEventListener('input', e => {
        state.studentCount = Number(e.target.value);
        document.getElementById('student-count-val').textContent = `${state.studentCount} 人`;
        state.markedStudents = state.markedStudents.filter(n => n <= state.studentCount);
        saveState();
        renderStudents();
      });

      document.getElementById('group-name-inputs').addEventListener('input', e => {
        if (!e.target.classList.contains('group-name-edit')) return;
        const idx = Number(e.target.dataset.gidx);
        state.groups[idx].name = e.target.value.trim() || DEFAULT_STATE.groups[idx].name;
        saveState();
        renderGroups();
      });

      document.getElementById('mic-device-select').addEventListener('change', e => {
        selectedMicId = e.target.value;
        if (micActive) {
          stopMicMonitor();
          startMicMonitor();
        }
      });

      document.getElementById('noise-threshold-range').addEventListener('input', e => {
        state.noiseThreshold = Number(e.target.value);
        document.getElementById('noise-threshold-val').textContent = String(state.noiseThreshold);
        saveState();
      });

      document.getElementById('sim-volume-range').addEventListener('input', e => {
        simVolume = Number(e.target.value);
        document.getElementById('sim-volume-val').textContent = String(simVolume);
        updateDbBars(simVolume);
        setQuietState(simVolume >= state.noiseThreshold, simVolume);
      });

      document.getElementById('custom-image-grid').addEventListener('change', e => {
        const input = e.target;
        if (input.type !== 'file' || !input.files || !input.files[0]) return;
        const key = input.dataset.imgKey;
        compressImageFile(input.files[0], dataUrl => {
          state.customImages[key] = dataUrl;
          saveState();
          renderImageEditor();
          renderQuietPenguin(penguinAwake);
          renderGroups();
          showToast('已更新自訂企鵝圖片');
        });
      });

      document.getElementById('custom-image-grid').addEventListener('click', e => {
        const clearBtn = e.target.closest('[data-clear-img]');
        if (!clearBtn) return;
        const key = clearBtn.dataset.clearImg;
        state.customImages[key] = '';
        saveState();
        renderImageEditor();
        renderQuietPenguin(penguinAwake);
        renderGroups();
        showToast('已還原預設企鵝外觀');
      });

      document.getElementById('reset-scores-btn').addEventListener('click', e => {
        const btn = e.currentTarget;
        if (!confirmResetScores) {
          confirmResetScores = true;
          btn.textContent = '再按一次確認重設分數';
          setTimeout(() => {
            confirmResetScores = false;
            btn.textContent = '重設所有分數';
          }, 4000);
          return;
        }
        confirmResetScores = false;
        btn.textContent = '重設所有分數';
        state.groups.forEach(g => { g.score = 0; });
        state.markedStudents = [];
        celebratingGroups = {};
        saveState();
        renderGroups();
        renderStudents();
        showToast('已重設所有組別分數及摘名標記');
      });

      document.getElementById('reset-all-btn').addEventListener('click', e => {
        const btn = e.currentTarget;
        if (!confirmResetAll) {
          confirmResetAll = true;
          btn.textContent = '再按一次確認恢復預設';
          setTimeout(() => {
            confirmResetAll = false;
            btn.textContent = '恢復預設設定';
          }, 4000);
          return;
        }
        confirmResetAll = false;
        btn.textContent = '恢復預設設定';
        state = deepClone(DEFAULT_STATE);
        simVolume = 0;
        celebratingGroups = {};
        saveState();
        renderModes();
        renderTasks();
        renderStudents();
        renderGroups();
        renderQuietPenguin(false);
        renderTaskEditor();
        renderClassEditor();
        renderQuietEditor();
        renderImageEditor();
        showToast('已恢復全部預設設定');
      });

      /* ==================== INITIALIZE ==================== */
      buildDbBars();
      renderModes();
      renderTasks();
      renderStudents();
      renderGroups();
      renderQuietPenguin(false);
      updateClockUI();
    })();
  </script>
</body>
</html>
