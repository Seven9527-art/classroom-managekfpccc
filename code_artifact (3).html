<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星艦企鵝三渲二班級管理平台</title>
  <style>
    :root {
      /* Deep Space Voxel Fleet + Dramatic Amber/Cyan Lighting Palette */
      --space-top: #07111e;
      --space-mid: #0e2038;
      --space-bot: #152d4b;

      --hull-white: #eef4fa;
      --hull-slate: #8fa6c2;
      --hull-dark: #1d314a;
      --hull-deep: #101e31;
      --ink-outline: #070e18;

      --gold-trim: #e8cf82;
      --gold-dark: #9c7e34;
      --cyan-glow: #64f0ff;
      --cyan-mid: #28b9d6;
      --cyan-dark: #146a84;
      --amber-glow: #ffae42;
      --amber-warm: #ff7e36;
      --amber-dark: #9e4110;
      --alert-red: #ff5652;
      --alert-red-dark: #9c1f1c;

      --text-main: #f3f8ff;
      --text-soft: #adc4de;
      --text-dark: #0e1d30;

      --radius-card: 20px;
      --font-main: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", "Hiragino Sans", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: var(--font-main);
      color: var(--text-main);
      background: radial-gradient(ellipse at 72% 18%, #1c3a5e 0%, #0e2036 48%, #07101c 100%);
      overflow-x: hidden;
    }

    @media (min-width: 1024px) and (min-height: 680px) {
      html, body {
        height: 100vh;
        overflow: hidden;
      }
    }

    /* ==================== VOXEL SPACE FLEET + CINEMATIC LIGHTING BACKDROP ==================== */
    .scenery-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    /* Dramatic warm amber & cool cyan atmospheric lighting cones (Ref 2 mood) */
    .cinematic-lights {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 46% 36% at 50% 42%, rgba(255, 174, 66, 0.16) 0%, transparent 72%),
        radial-gradient(ellipse 42% 32% at 16% 24%, rgba(100, 240, 255, 0.15) 0%, transparent 70%),
        radial-gradient(ellipse 48% 36% at 86% 28%, rgba(100, 240, 255, 0.14) 0%, transparent 70%),
        linear-gradient(122deg, transparent 20%, rgba(114, 236, 255, 0.08) 32%, transparent 44%),
        linear-gradient(122deg, transparent 58%, rgba(255, 188, 92, 0.10) 67%, transparent 78%);
      animation: light-breathe 9s ease-in-out infinite alternate;
    }

    @keyframes light-breathe {
      0% { opacity: 0.82; }
      100% { opacity: 1; }
    }

    /* Glossy Reflective Voxel Hangar Deck at bottom (Ref 2 wet specular floor) */
    .reflective-deck {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 26vh;
      min-height: 165px;
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.03) 0px, rgba(255, 255, 255, 0.03) 1px, transparent 1px, transparent 64px),
        linear-gradient(180deg, rgba(16, 33, 54, 0.4) 0%, rgba(10, 21, 36, 0.92) 42%, #081220 100%);
      border-top: 2px solid rgba(100, 240, 255, 0.28);
    }
    .reflective-deck::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 26% 65% at 24% 35%, rgba(100, 240, 255, 0.16) 0%, transparent 70%),
        radial-gradient(ellipse 28% 72% at 50% 42%, rgba(255, 168, 66, 0.22) 0%, transparent 70%),
        radial-gradient(ellipse 26% 65% at 78% 38%, rgba(100, 240, 255, 0.16) 0%, transparent 70%);
      filter: blur(8px);
    }

    .bg-fleet-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.85;
    }

    @keyframes fleet-drift {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(16px, -6px); }
    }
    .fleet-group-a { animation: fleet-drift 16s ease-in-out infinite; }
    .fleet-group-b { animation: fleet-drift 20s ease-in-out infinite reverse; }

    /* Particle Canvases */
    #ambient-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 95;
    }

    /* ==================== MAIN SHELL ==================== */
    .app-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1880px;
      height: 100%;
      margin: 0 auto;
      padding: clamp(10px, 1.4vh, 18px) clamp(14px, 2vw, 34px) clamp(12px, 1.6vh, 22px);
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.4vh, 18px);
    }

    /* Cel-Shaded Sci-Fi Armor Glass Panel */
    .cel-card {
      background:
        linear-gradient(160deg, rgba(28, 48, 76, 0.86) 0%, rgba(16, 30, 50, 0.90) 60%, rgba(11, 22, 38, 0.94) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: var(--radius-card);
      border: 2.5px solid #070e18;
      box-shadow:
        0 8px 0 #07101c,
        0 18px 34px rgba(0, 0, 0, 0.52),
        inset 0 2px 0 rgba(160, 226, 255, 0.32),
        inset 0 -3px 0 rgba(0, 0, 0, 0.45);
    }

    /* ==================== HIGH-EXTRUSION 三渲二 (CEL-SHADED 3D) BUTTONS ==================== */
    .btn-3d {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      font-weight: 900;
      border: 2.5px solid var(--ink-outline);
      cursor: pointer;
      transition: transform 0.11s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.11s ease,
                  filter 0.14s ease,
                  background 0.2s ease;
      outline: none;
      overflow: hidden;
    }
    /* Crisp anime top-edge cel specular sheen */
    .btn-3d::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 6px;
      right: 6px;
      height: 34%;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.48) 0%, rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
    }
    .btn-3d:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }
    .btn-3d:active {
      transform: translateY(5px);
    }
    .btn-3d:focus-visible {
      outline: 3px solid var(--cyan-glow);
      outline-offset: 2px;
    }

    /* ==================== TOP BAR ==================== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .mode-tray {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px 12px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(28, 50, 78, 0.92) 0%, rgba(14, 27, 45, 0.95) 100%);
      border: 2.5px solid var(--ink-outline);
      box-shadow: 0 7px 0 #07101c, 0 14px 26px rgba(0, 0, 0, 0.45), inset 0 2px 0 rgba(232, 207, 130, 0.35);
    }

    .mode-btn {
      padding: 8px 26px;
      border-radius: 14px;
      font-size: clamp(16px, 1.3vw, 21px);
      letter-spacing: 0.08em;
      color: var(--text-dark);
    }

    .mode-btn[data-mode="lunch"] {
      background: linear-gradient(180deg, #f6e4aa 0%, #e0c16c 58%, #c9a549 100%);
      box-shadow: 0 7px 0 #7a5f1d, 0 11px 16px rgba(0, 0, 0, 0.42), inset 0 -2px 0 rgba(0, 0, 0, 0.18);
    }
    .mode-btn[data-mode="reading"] {
      background: linear-gradient(180deg, #d7f0ff 0%, #98c7e4 58%, #76aacb 100%);
      box-shadow: 0 7px 0 #37617d, 0 11px 16px rgba(0, 0, 0, 0.42), inset 0 -2px 0 rgba(0, 0, 0, 0.18);
    }
    .mode-btn[data-mode="class"] {
      background: linear-gradient(180deg, #e5edf5 0%, #b5c7dc 58%, #95acc7 100%);
      box-shadow: 0 7px 0 #485e7a, 0 11px 16px rgba(0, 0, 0, 0.42), inset 0 -2px 0 rgba(0, 0, 0, 0.18);
    }

    .mode-btn.active {
      background: linear-gradient(180deg, #ffd175 0%, #ff993b 55%, #e5721c 100%) !important;
      color: #fffef9;
      text-shadow: 0 2px 0 rgba(120, 38, 6, 0.75);
      box-shadow:
        0 7px 0 #8a3408,
        0 0 24px rgba(255, 166, 62, 0.65),
        0 12px 20px rgba(0, 0, 0, 0.45) !important;
    }
    .mode-btn:active {
      box-shadow: 0 2px 0 #070e18, 0 4px 8px rgba(0, 0, 0, 0.4) !important;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 4px;
    }

    .clock-pill {
      padding: 8px 22px;
      border-radius: 16px;
      background: linear-gradient(180deg, #f3f8ff 0%, #d2e2f2 60%, #b4cadf 100%);
      box-shadow: 0 7px 0 #4a637d, 0 12px 22px rgba(0, 0, 0, 0.45), 0 0 14px rgba(100, 240, 255, 0.25);
      color: var(--text-dark);
      font-size: clamp(22px, 1.95vw, 31px);
      font-weight: 900;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      min-width: 150px;
    }
    .clock-pill:active {
      box-shadow: 0 2px 0 #4a637d;
    }
    .clock-pill.timer-running {
      background: linear-gradient(180deg, #ffe79e 0%, #ffba49 58%, #e89624 100%);
      color: #4a1e04;
      box-shadow: 0 7px 0 #8c4d0a, 0 0 24px rgba(255, 186, 73, 0.65);
    }
    .clock-pill.timer-finished {
      animation: timer-alarm-flash 0.5s ease-in-out infinite alternate;
    }
    @keyframes timer-alarm-flash {
      0% { background: #ff9c94; color: #5c0c08; transform: scale(1); box-shadow: 0 7px 0 #8a1d17, 0 0 14px rgba(255,86,82,0.5); }
      100% { background: #ff5652; color: #ffffff; transform: scale(1.04); box-shadow: 0 7px 0 #78120e, 0 0 28px rgba(255,86,82,0.9); }
    }

    .settings-pill {
      padding: 10px 22px;
      border-radius: 16px;
      background: linear-gradient(180deg, #d8f4ff 0%, #8cd5ea 58%, #63b5d1 100%);
      box-shadow: 0 7px 0 #26657d, 0 12px 22px rgba(0, 0, 0, 0.45);
      color: var(--text-dark);
      font-size: clamp(16px, 1.25vw, 20px);
    }
    .settings-pill:active {
      box-shadow: 0 2px 0 #26657d;
    }

    /* ==================== MIDDLE ROW (3 CORE CARDS) ==================== */
    .middle-grid {
      display: grid;
      grid-template-columns: 1fr 1.14fr 1fr;
      gap: clamp(12px, 1.5vw, 22px);
      flex: 1.08;
      min-height: 0;
    }

    .panel-card {
      position: relative;
      display: flex;
      flex-direction: column;
      padding: clamp(12px, 1.4vh, 18px) clamp(14px, 1.5vw, 22px);
      min-height: 0;
      overflow: hidden;
    }

    /* Gold & Cyan Voxel Tech Top Accent Strip */
    .panel-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 24px;
      right: 24px;
      height: 4px;
      border-radius: 0 0 6px 6px;
      background: linear-gradient(90deg, var(--gold-trim) 0%, var(--cyan-glow) 50%, var(--gold-trim) 100%);
      box-shadow: 0 0 12px rgba(100, 240, 255, 0.55);
      pointer-events: none;
    }

    .card-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: clamp(8px, 1.1vh, 13px);
      flex-shrink: 0;
      z-index: 2;
    }

    .card-title {
      margin: 0;
      font-size: clamp(19px, 1.6vw, 26px);
      font-weight: 900;
      color: #f4f9ff;
      letter-spacing: 0.12em;
      text-shadow: 0 3px 0 #07111e, 0 0 14px rgba(100, 240, 255, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }
    .card-title::before,
    .card-title::after {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 2px;
      transform: rotate(45deg);
      background: var(--gold-trim);
      border: 1.8px solid var(--ink-outline);
      box-shadow: 0 0 8px rgba(232, 207, 130, 0.7);
    }

    /* --- (A) Tasks Panel (NO strikethrough when checked!) --- */
    .task-list {
      list-style: none;
      margin: 0;
      padding: 2px 4px;
      display: flex;
      flex-direction: column;
      gap: clamp(5px, 0.7vh, 10px);
      overflow-y: auto;
      flex: 1;
      z-index: 2;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: clamp(4px, 0.58vh, 8px) 10px;
      border-radius: 14px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid rgba(143, 182, 218, 0.22);
      box-shadow: 0 4px 0 rgba(5, 11, 20, 0.45);
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .task-item:hover {
      transform: translateX(4px);
      background: rgba(100, 240, 255, 0.10);
      border-color: rgba(100, 240, 255, 0.45);
    }
    .task-item.checked {
      background: rgba(255, 174, 66, 0.12);
      border-color: rgba(255, 198, 102, 0.55);
      box-shadow: 0 4px 0 rgba(5, 11, 20, 0.55), 0 0 14px rgba(255, 174, 66, 0.2);
    }

    .task-checkbox {
      width: clamp(28px, 2.1vw, 34px);
      height: clamp(28px, 2.1vw, 34px);
      flex-shrink: 0;
      border-radius: 9px;
      border: 2.5px solid var(--ink-outline);
      background: linear-gradient(180deg, #dce8f5 0%, #a4bdd6 100%);
      box-shadow: 0 5px 0 #3f5873, inset 0 2px 0 rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .task-item.checked .task-checkbox {
      background: linear-gradient(180deg, #ffd070 0%, #ff9330 60%, #e06d16 100%);
      box-shadow: 0 5px 0 #8a3508, 0 0 14px rgba(255, 166, 62, 0.65), inset 0 2px 0 rgba(255, 255, 255, 0.7);
      transform: scale(1.05);
    }

    .task-check-svg {
      width: 18px;
      height: 18px;
      stroke: #ffffff;
      stroke-width: 3.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0;
      transform: scale(0.4);
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .task-item.checked .task-check-svg {
      opacity: 1;
      transform: scale(1);
    }

    .task-label {
      font-size: clamp(15px, 1.28vw, 20px);
      font-weight: 800;
      color: var(--text-soft);
      padding: 3px 11px;
      border-radius: 10px;
      line-height: 1.35;
      transition: all 0.2s ease;
      flex: 1;
    }

    /* Checked task: bright cel-shaded energy pill, NO strikethrough! */
    .task-item.checked .task-label {
      color: var(--text-dark);
      text-decoration: none;
      border: 2px solid var(--ink-outline);
      box-shadow: 0 4px 0 rgba(7, 14, 24, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.72);
    }
    .task-item.checked.tint-0 .task-label { background: linear-gradient(180deg, #ffe2b3 0%, #f6bc6e 100%); }
    .task-item.checked.tint-1 .task-label { background: linear-gradient(180deg, #ccf9ff 0%, #7ee3f2 100%); }
    .task-item.checked.tint-2 .task-label { background: linear-gradient(180deg, #fff1b8 0%, #f2d268 100%); }
    .task-item.checked.tint-3 .task-label { background: linear-gradient(180deg, #cef7cf 0%, #86e095 100%); }

    /* --- (B) Quiet Challenge Panel (Orbital Fleet Shield Deck, NO houses!) --- */
    .quiet-card {
      position: relative;
      border-radius: var(--radius-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(12px, 1.4vh, 18px) clamp(14px, 1.5vw, 20px);
      background: linear-gradient(180deg, #0b182a 0%, #142a46 52%, #0e1e33 100%);
      border: 2.5px solid #070e18;
      box-shadow:
        0 8px 0 #07101c,
        0 18px 36px rgba(0, 0, 0, 0.56),
        inset 0 2px 0 rgba(100, 240, 255, 0.45);
      transition: box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .quiet-card.noisy {
      border-color: var(--alert-red);
      box-shadow:
        0 0 0 4px rgba(255, 86, 82, 0.42),
        0 8px 0 #7a1715,
        0 18px 36px rgba(220, 45, 40, 0.46),
        inset 0 0 50px rgba(255, 86, 82, 0.48);
    }

    .quiet-scenery-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Dramatic warm lantern & cyan rim light cone inside Quiet Challenge */
    .quiet-dramatic-glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 68% 48% at 50% 62%, rgba(255, 174, 66, 0.24) 0%, transparent 72%),
        radial-gradient(ellipse 60% 42% at 50% 44%, rgba(100, 240, 255, 0.18) 0%, transparent 72%);
      pointer-events: none;
      z-index: 1;
      transition: background 0.25s ease;
    }
    .quiet-card.noisy .quiet-dramatic-glow {
      background: radial-gradient(ellipse 75% 65% at 50% 52%, rgba(255, 86, 82, 0.35) 0%, transparent 75%);
    }

    .quiet-header {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .quiet-status-badge {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      font-weight: 900;
      padding: 4px 11px;
      border-radius: 10px;
      background: linear-gradient(180deg, #1b3654 0%, #10243a 100%);
      border: 2px solid var(--cyan-glow);
      color: var(--cyan-glow);
      box-shadow: 0 3px 0 #07101c, 0 0 10px rgba(100, 240, 255, 0.35);
      transition: all 0.2s ease;
    }
    .quiet-card.noisy .quiet-status-badge {
      background: linear-gradient(180deg, #ff706b 0%, var(--alert-red) 100%);
      border-color: #ffe2b3;
      color: #fff;
      box-shadow: 0 3px 0 #7a1715, 0 0 16px rgba(255, 86, 82, 0.8);
      animation: badge-pulse 0.4s ease-in-out infinite alternate;
    }
    @keyframes badge-pulse {
      from { transform: translateY(-50%) scale(1); }
      to { transform: translateY(-50%) scale(1.09); }
    }

    .quiet-stage {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 132px;
    }

    /* Translucent Cyan Energy Shield Bubble (Ref 1 signature) */
    .energy-shield-ring {
      position: absolute;
      width: clamp(152px, 14.8vw, 212px);
      height: clamp(144px, 14vw, 200px);
      border-radius: 50%;
      border: 2.5px solid rgba(100, 240, 255, 0.55);
      background: radial-gradient(circle at 35% 28%, rgba(160, 250, 255, 0.2) 0%, rgba(40, 185, 214, 0.08) 58%, rgba(100, 240, 255, 0.24) 100%);
      box-shadow: 0 0 24px rgba(100, 240, 255, 0.32), inset 0 0 18px rgba(100, 240, 255, 0.25);
      pointer-events: none;
      animation: shield-pulse 3.6s ease-in-out infinite;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .quiet-card.noisy .energy-shield-ring {
      border-color: rgba(255, 96, 86, 0.85);
      background: radial-gradient(circle at 50% 50%, rgba(255, 100, 90, 0.14) 0%, rgba(255, 70, 60, 0.32) 100%);
      box-shadow: 0 0 32px rgba(255, 86, 82, 0.7), inset 0 0 24px rgba(255, 120, 80, 0.45);
    }
    @keyframes shield-pulse {
      0%, 100% { transform: scale(1); opacity: 0.86; }
      50% { transform: scale(1.035); opacity: 1; }
    }

    .quiet-penguin-wrap {
      position: relative;
      width: clamp(134px, 13.2vw, 190px);
      height: clamp(134px, 13.2vw, 190px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quiet-penguin-visual {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: penguin-sleep-breathe 3.4s ease-in-out infinite;
      transform-origin: 50% 85%;
      filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.55));
    }
    .quiet-penguin-visual img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 20px;
    }

    .quiet-card.noisy .quiet-penguin-visual {
      animation: penguin-startle 0.3s ease-in-out infinite;
    }

    @keyframes penguin-sleep-breathe {
      0%, 100% { transform: rotate(-2deg) scale(1, 1); }
      50% { transform: rotate(2deg) scale(1.03, 0.97); }
    }

    @keyframes penguin-startle {
      0% { transform: translate(0, 0) rotate(-3deg) scale(1.04); }
      25% { transform: translate(-3px, -5px) rotate(3deg) scale(1.07); }
      50% { transform: translate(3px, -2px) rotate(-2deg) scale(1.05); }
      75% { transform: translate(-2px, -4px) rotate(2deg) scale(1.07); }
      100% { transform: translate(0, 0) rotate(-3deg) scale(1.04); }
    }

    .zzz-layer {
      position: absolute;
      top: 4px;
      right: -10px;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .quiet-card.noisy .zzz-layer {
      opacity: 0;
    }
    .zzz-char {
      position: absolute;
      font-weight: 900;
      color: var(--cyan-glow);
      -webkit-text-stroke: 1.5px var(--ink-outline);
      text-shadow: 0 0 10px rgba(100, 240, 255, 0.8);
      animation: float-zzz 2.8s ease-in-out infinite;
    }
    .zzz-1 { font-size: 16px; right: 24px; top: 28px; animation-delay: 0s; }
    .zzz-2 { font-size: 22px; right: 8px; top: 10px; animation-delay: 0.7s; }
    .zzz-3 { font-size: 28px; right: -10px; top: -10px; animation-delay: 1.4s; }

    @keyframes float-zzz {
      0% { opacity: 0; transform: translate(0, 10px) scale(0.75) rotate(-8deg); }
      35% { opacity: 1; }
      100% { opacity: 0; transform: translate(12px, -22px) scale(1.14) rotate(10deg); }
    }

    .alert-sparks {
      position: absolute;
      inset: -8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .quiet-card.noisy .alert-sparks {
      opacity: 1;
    }

    .quiet-controls {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(6px, 0.95vh, 10px);
    }

    .db-meter-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 14px;
      background: rgba(11, 22, 38, 0.88);
      border: 2.5px solid var(--ink-outline);
      box-shadow: 0 4px 0 #050b14, inset 0 1px 0 rgba(100, 240, 255, 0.35);
    }

    .db-bars {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 26px;
    }

    .db-bar {
      width: clamp(8px, 0.75vw, 12px);
      border-radius: 4px;
      background: rgba(110, 150, 185, 0.26);
      border: 1px solid rgba(100, 240, 255, 0.18);
      transition: background 0.08s ease, box-shadow 0.08s ease;
    }
    .db-bar.lit-green {
      background: linear-gradient(180deg, #98ffec 0%, #39e5c6 100%);
      border-color: #167a69;
      box-shadow: 0 0 10px rgba(57, 229, 198, 0.85);
    }
    .db-bar.lit-yellow {
      background: linear-gradient(180deg, #fff08a 0%, #ffc43d 100%);
      border-color: #9e6b14;
      box-shadow: 0 0 10px rgba(255, 196, 61, 0.85);
    }
    .db-bar.lit-orange {
      background: linear-gradient(180deg, #ffb45c 0%, #ff7d2e 100%);
      border-color: #9c4311;
      box-shadow: 0 0 12px rgba(255, 125, 46, 0.9);
    }
    .db-bar.lit-red {
      background: linear-gradient(180deg, #ff8278 0%, #ff3e38 100%);
      border-color: #8c1a16;
      box-shadow: 0 0 14px rgba(255, 62, 56, 0.95);
    }

    .quiet-btn-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 3px;
    }

    .quiet-start-btn {
      padding: 8px 38px;
      border-radius: 15px;
      font-size: clamp(16px, 1.3vw, 21px);
      letter-spacing: 0.12em;
      color: #fffef9;
      background: linear-gradient(180deg, #ffc966 0%, #f58c2c 55%, #de6c16 100%);
      box-shadow: 0 7px 0 #8a3608, 0 12px 20px rgba(0, 0, 0, 0.5), 0 0 18px rgba(255, 158, 52, 0.45);
      text-shadow: 0 2px 0 rgba(120, 42, 8, 0.65);
    }
    .quiet-start-btn.listening {
      background: linear-gradient(180deg, #ff8a80 0%, #ef4c42 55%, #cf2f27 100%);
      box-shadow: 0 7px 0 #7d1612, 0 12px 20px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 76, 66, 0.6);
    }
    .quiet-start-btn:active {
      box-shadow: 0 2px 0 #070e18;
    }

    .mic-notice {
      font-size: 12px;
      font-weight: 800;
      color: #ffe2b3;
      background: rgba(120, 26, 22, 0.92);
      border: 1.5px solid #ff7c70;
      padding: 4px 11px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }
    .mic-notice.visible {
      display: block;
    }

    /* --- (C) Name Board Panel --- */
    .clear-marks-btn {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      padding: 4px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 900;
      color: var(--text-dark);
      background: linear-gradient(180deg, #f3e4b2 0%, #dfc06c 100%);
      box-shadow: 0 4px 0 #7c601c;
    }
    .clear-marks-btn:hover {
      transform: translateY(calc(-50% - 2px));
    }
    .clear-marks-btn:active {
      transform: translateY(calc(-50% + 2px));
      box-shadow: 0 1px 0 #7c601c;
    }

    .student-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: clamp(7px, 0.72vw, 10px);
      flex: 1;
      align-content: center;
      overflow-y: auto;
      padding: 4px 4px 8px;
      z-index: 2;
    }

    .student-tile {
      aspect-ratio: 1.12 / 1;
      min-height: 36px;
      border-radius: 11px;
      font-size: clamp(15px, 1.3vw, 21px);
      font-weight: 900;
      color: var(--text-dark);
      background: linear-gradient(180deg, #f5faff 0%, #d2e2f2 58%, #b3c9e0 100%);
      box-shadow: 0 6px 0 #48617a, 0 9px 14px rgba(0, 0, 0, 0.42);
      position: relative;
    }
    .student-tile:active {
      box-shadow: 0 1px 0 #48617a;
    }

    .student-tile.marked {
      background: linear-gradient(180deg, #ff8f85 0%, var(--alert-red) 55%, #d6322b 100%);
      border-color: #2b0706;
      color: #ffffff;
      text-shadow: 0 2px 0 rgba(120, 18, 14, 0.75);
      box-shadow: 0 6px 0 #7a1714, 0 0 20px rgba(255, 86, 82, 0.75);
      animation: mark-pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes mark-pop {
      0% { transform: scale(0.88); }
      55% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    /* ==================== BOTTOM ROW (VOXEL HANGAR DECK GROUP SCORING) ==================== */
    .groups-card {
      position: relative;
      flex: 1.07;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: clamp(10px, 1.1vh, 15px) clamp(14px, 1.6vw, 24px) clamp(10px, 1.2vh, 15px);
      overflow: hidden;
      border-radius: var(--radius-card);
      border: 2.5px solid var(--ink-outline);
      background:
        linear-gradient(180deg,
          rgba(22, 40, 64, 0.88) 0%,
          rgba(14, 27, 45, 0.92) 55%,
          rgba(11, 23, 38, 0.96) 57%,
          rgba(8, 17, 30, 0.98) 100%);
      backdrop-filter: blur(12px);
      box-shadow:
        0 8px 0 #07101c,
        0 18px 36px rgba(0, 0, 0, 0.56),
        inset 0 2px 0 rgba(232, 207, 130, 0.35);
    }

    /* Reflective glossy hangar deck surface with warm amber & cyan floor streaks (Ref 2) */
    .groups-card::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 44%;
      background:
        repeating-linear-gradient(90deg, rgba(100, 240, 255, 0.06) 0px, rgba(100, 240, 255, 0.06) 1px, transparent 1px, transparent 48px),
        radial-gradient(ellipse 14% 70% at 9% 30%, rgba(255, 176, 68, 0.22) 0%, transparent 72%),
        radial-gradient(ellipse 14% 70% at 26% 30%, rgba(100, 240, 255, 0.18) 0%, transparent 72%),
        radial-gradient(ellipse 14% 70% at 42% 30%, rgba(255, 176, 68, 0.20) 0%, transparent 72%),
        radial-gradient(ellipse 14% 70% at 58% 30%, rgba(100, 240, 255, 0.18) 0%, transparent 72%),
        radial-gradient(ellipse 14% 70% at 74% 30%, rgba(255, 176, 68, 0.22) 0%, transparent 72%),
        radial-gradient(ellipse 14% 70% at 91% 30%, rgba(100, 240, 255, 0.18) 0%, transparent 72%);
      border-top: 2px solid rgba(100, 240, 255, 0.35);
      pointer-events: none;
      z-index: 0;
    }

    .groups-row {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: clamp(8px, 1.1vw, 18px);
      flex: 1;
      min-height: 0;
      align-items: end;
    }

    .group-slot {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 4px;
    }

    /* Sci-Fi Hangar Bay Alcove with Warm Lantern Overhead Light */
    .group-arch {
      position: absolute;
      top: 16px;
      left: 5%;
      right: 5%;
      bottom: 68px;
      border-radius: 18px 18px 14px 14px;
      background:
        radial-gradient(ellipse 85% 48% at 50% 15%, rgba(255, 184, 78, 0.22) 0%, transparent 70%),
        linear-gradient(180deg, rgba(35, 62, 96, 0.65) 0%, rgba(15, 29, 48, 0.85) 100%);
      border: 2px solid rgba(130, 178, 222, 0.28);
      box-shadow: inset 0 6px 18px rgba(0, 0, 0, 0.48), 0 0 12px rgba(100, 240, 255, 0.08);
      z-index: 0;
    }
    .group-arch::after {
      content: "";
      position: absolute;
      top: 6px;
      left: 26%;
      right: 26%;
      height: 4px;
      border-radius: 999px;
      background: var(--amber-glow);
      box-shadow: 0 0 14px rgba(255, 174, 66, 0.9);
    }

    .group-name-tag {
      position: relative;
      z-index: 3;
      padding: 4px 16px;
      border-radius: 11px;
      font-size: clamp(14px, 1.15vw, 18px);
      font-weight: 900;
      color: var(--text-dark);
      background: linear-gradient(180deg, #fae7a8 0%, #e4c164 60%, #cca241 100%);
      border: 2px solid var(--ink-outline);
      box-shadow: 0 4px 0 #7a5c18, 0 6px 12px rgba(0, 0, 0, 0.4);
      margin-bottom: auto;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .group-stage {
      position: relative;
      z-index: 2;
      width: 100%;
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      min-height: 92px;
      margin-top: 2px;
    }

    .group-penguin-wrap {
      position: relative;
      width: clamp(104px, 10vw, 152px);
      height: clamp(104px, 10vw, 152px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: penguin-idle 3.2s ease-in-out infinite;
      transform-origin: 50% 90%;
      filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.52));
      z-index: 2;
    }

    .group-slot:nth-child(2) .group-penguin-wrap { animation-delay: -0.5s; animation-duration: 2.9s; }
    .group-slot:nth-child(3) .group-penguin-wrap { animation-delay: -1.1s; animation-duration: 3.5s; }
    .group-slot:nth-child(4) .group-penguin-wrap { animation-delay: -1.7s; animation-duration: 3.1s; }
    .group-slot:nth-child(5) .group-penguin-wrap { animation-delay: -2.2s; animation-duration: 3.4s; }
    .group-slot:nth-child(6) .group-penguin-wrap { animation-delay: -0.9s; animation-duration: 3.0s; }

    .group-penguin-wrap.celebrating {
      animation: penguin-cheer 0.4s ease-in-out infinite !important;
    }

    .group-penguin-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 16px;
    }

    @keyframes penguin-idle {
      0%, 100% { transform: rotate(-2.2deg) translateY(0px) scaleY(1); }
      50% { transform: rotate(2.2deg) translateY(-4px) scaleY(1.028); }
    }

    @keyframes penguin-cheer {
      0%, 100% { transform: translateY(0px) rotate(-5deg) scale(1.05); }
      50% { transform: translateY(-16px) rotate(5deg) scale(1.12); }
    }

    /* Fish Pile around penguin */
    .fish-pile {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .fish-item {
      position: absolute;
      width: clamp(23px, 2.1vw, 32px);
      height: clamp(17px, 1.5vw, 23px);
      animation: fish-pop 0.44s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.45));
    }

    @keyframes fish-pop {
      0% { opacity: 0; transform: scale(0) translateY(12px) rotate(-22deg); }
      65% { opacity: 1; transform: scale(1.28) translateY(-5px) rotate(6deg); }
      100% { opacity: 1; transform: scale(1) translateY(0px) rotate(0deg); }
    }

    .group-celebrate-banner {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      background: linear-gradient(180deg, #ffe26a 0%, #f4a428 100%);
      border: 2.5px solid var(--ink-outline);
      color: var(--text-dark);
      font-size: 13px;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 10px;
      white-space: nowrap;
      box-shadow: 0 5px 0 #8f4d08, 0 0 20px rgba(255, 200, 66, 0.85);
      animation: banner-bounce 0.45s ease-in-out infinite alternate;
    }
    @keyframes banner-bounce {
      from { transform: translateX(-50%) scale(1); }
      to { transform: translateX(-50%) scale(1.1); }
    }

    .group-footer {
      position: relative;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .score-pill {
      padding: 2px 14px;
      border-radius: 10px;
      background: linear-gradient(180deg, #1b3452 0%, #102238 100%);
      border: 2px solid var(--cyan-glow);
      box-shadow: 0 3px 0 #07101c, 0 0 10px rgba(100, 240, 255, 0.25);
      font-size: clamp(14px, 1.18vw, 18px);
      font-weight: 900;
      color: #f3f9ff;
      font-variant-numeric: tabular-nums;
      min-width: 78px;
      text-align: center;
    }

    .score-btn-group {
      display: flex;
      align-items: center;
      gap: 7px;
      padding-bottom: 3px;
    }

    .plus-btn {
      padding: 4px 22px;
      border-radius: 12px;
      background: linear-gradient(180deg, #e5f9ff 0%, #86def2 58%, #52bedb 100%);
      box-shadow: 0 6px 0 #1f6680, 0 10px 16px rgba(0, 0, 0, 0.48), 0 0 12px rgba(100, 240, 255, 0.35);
      font-size: clamp(15px, 1.22vw, 19px);
      color: var(--text-dark);
    }
    .plus-btn:active {
      box-shadow: 0 1px 0 #1f6680;
    }

    .minus-btn {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: linear-gradient(180deg, #dce8f5 0%, #a0b8d1 100%);
      box-shadow: 0 5px 0 #445b73;
      font-size: 15px;
      color: var(--text-dark);
      padding: 0;
      opacity: 0.9;
    }
    .minus-btn:hover {
      opacity: 1;
    }
    .minus-btn:active {
      box-shadow: 0 1px 0 #445b73;
    }

    /* ==================== MODALS ==================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 11, 20, 0.68);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-backdrop.open {
      display: flex;
      animation: fade-in 0.18s ease;
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-box {
      width: 100%;
      max-width: 680px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      padding: 22px 24px;
      position: relative;
      background: linear-gradient(165deg, #1b304d 0%, #112138 100%);
      border: 2.5px solid var(--ink-outline);
      border-radius: 22px;
      box-shadow: 0 10px 0 #07101c, 0 26px 52px rgba(0, 0, 0, 0.65), inset 0 2px 0 rgba(100, 240, 255, 0.35);
      color: var(--text-main);
      animation: modal-pop 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-box.timer-box {
      max-width: 420px;
    }
    @keyframes modal-pop {
      from { opacity: 0; transform: scale(0.92) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(100, 240, 255, 0.22);
    }
    .modal-title {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      color: #f5faff;
    }
    .modal-close {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: linear-gradient(180deg, #e5f0fa 0%, #adc4dc 100%);
      color: var(--text-dark);
      font-size: 18px;
      box-shadow: 0 5px 0 #48617a;
    }

    .modal-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      padding-bottom: 4px;
    }
    .modal-tab-btn {
      padding: 7px 15px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 900;
      color: var(--text-dark);
      background: linear-gradient(180deg, #dce9f5 0%, #a5bed6 100%);
      box-shadow: 0 5px 0 #46607a;
    }
    .modal-tab-btn.active {
      background: linear-gradient(180deg, #ffd070 0%, #f58c2c 100%);
      color: #fff;
      box-shadow: 0 5px 0 #8a3608;
    }

    .modal-body {
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
    }

    .tab-pane {
      display: none;
    }
    .tab-pane.active {
      display: block;
    }

    .form-section {
      background: rgba(8, 17, 30, 0.52);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1.5px solid rgba(100, 240, 255, 0.2);
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--gold-trim);
    }

    .felt-input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 11px;
      border: 2px solid #456a8c;
      background: #0c192b;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      color: #f3f9ff;
      outline: none;
    }
    .felt-input:focus {
      border-color: var(--cyan-glow);
      box-shadow: 0 0 0 3px rgba(100, 240, 255, 0.25);
    }

    .task-edit-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .small-action-btn {
      padding: 7px 14px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(180deg, #ffc966 0%, #ef8428 100%);
      box-shadow: 0 5px 0 #8a3608;
      flex-shrink: 0;
    }
    .small-action-btn.danger {
      background: linear-gradient(180deg, #ff857c 0%, #e5433b 100%);
      box-shadow: 0 5px 0 #821712;
    }
    .small-action-btn.neutral {
      background: linear-gradient(180deg, #e5f1fa 0%, #afc6dc 100%);
      color: var(--text-dark);
      box-shadow: 0 5px 0 #48617a;
    }

    .group-name-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .range-row input[type="range"] {
      flex: 1;
      accent-color: var(--cyan-glow);
      height: 8px;
      cursor: pointer;
    }
    .range-value {
      min-width: 54px;
      text-align: center;
      font-weight: 900;
      background: #17304d;
      color: var(--cyan-glow);
      border: 1.5px solid rgba(100, 240, 255, 0.35);
      padding: 4px 8px;
      border-radius: 9px;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .upload-card {
      background: rgba(18, 34, 56, 0.85);
      border-radius: 14px;
      padding: 10px;
      border: 1.5px solid rgba(100, 240, 255, 0.22);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .upload-preview {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #0d1d33;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-size: 20px;
    }
    .upload-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .upload-info {
      flex: 1;
      min-width: 0;
    }
    .upload-title {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 5px;
      color: #eaf3ff;
    }
    .upload-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 2px solid rgba(100, 240, 255, 0.22);
      flex-wrap: wrap;
    }

    .timer-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .timer-preset-btn {
      padding: 10px 8px;
      border-radius: 12px;
      background: linear-gradient(180deg, #e5f6ff 0%, #98d8eb 100%);
      box-shadow: 0 5px 0 #2b6f85;
      color: var(--text-dark);
      font-size: 15px;
    }
    .timer-custom-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .timer-action-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      padding-bottom: 4px;
    }
    .timer-big-btn {
      padding: 10px 22px;
      border-radius: 13px;
      font-size: 16px;
      color: #fff;
      background: linear-gradient(180deg, #ffc966 0%, #ef8428 100%);
      box-shadow: 0 6px 0 #8a3608;
    }
    .timer-big-btn.secondary {
      background: linear-gradient(180deg, #e5f1fa 0%, #afc6dc 100%);
      color: var(--text-dark);
      box-shadow: 0 6px 0 #48617a;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #10233b;
      color: #f4faff;
      border: 2px solid var(--cyan-glow);
      padding: 10px 22px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55), 0 0 18px rgba(100, 240, 255, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 150;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1023px) {
      .middle-grid {
        grid-template-columns: 1fr;
      }
      .groups-row {
        grid-template-columns: repeat(3, 1fr);
        row-gap: 18px;
      }
      .groups-card {
        min-height: 450px;
      }
      .group-arch {
        bottom: 68px;
      }
    }

    @media (max-width: 600px) {
      .groups-row {
        grid-template-columns: repeat(2, 1fr);
      }
      .mode-btn {
        padding: 8px 16px;
        font-size: 15px;
      }
      .group-name-grid,
      .upload-grid {
        grid-template-columns: 1fr;
      }
    }

    @keyframes flame-flicker {
      0%, 100% { transform: scale(1) rotate(-1.5deg); opacity: 0.96; }
      50% { transform: scale(1.07, 1.12) rotate(1.5deg); opacity: 1; }
    }
    .svg-flame {
      transform-origin: 50% 80%;
      animation: flame-flicker 0.55s ease-in-out infinite;
    }
  </style>
</head>

            <rect x="314" y="76" width="52" height="5" fill="#e8cf82"/>
            <rect x="322" y="86" width="32" height="6" fill="#64f0ff"/>
            <polygon points="274,88 306,82 306,94" fill="#64f0ff" opacity="0.65"/>
          </g>
          <!-- Voxel side armor pillars with warm glowing lanterns (Ref 2 lighting) -->
          <rect x="0" y="0" width="28" height="225" fill="#1c324d" stroke="#070e18" stroke-width="2.4"/>
          <rect x="28" y="88" width="12" height="24" rx="2" fill="#ffbe55" stroke="#070e18" stroke-width="2"/>

  <!-- ==================== COUNTDOWN TIMER MODAL ==================== -->
  <div id="timer-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="timer-modal-title">

      <div class="modal-header">
        <h3 id="timer-modal-title" class="modal-title">⏱️ 課室倒數計時器</h3>
        <button type="button" class="btn-3d modal-close" data-close-modal="timer-modal" aria-label="關閉">✕</button>

        <div class="form-section">
          <span class="form-label">快速選擇時間</span>

            <button type="button" class="btn-3d timer-preset-btn" data-timer-min="10">10 分鐘</button>
          </div>
          <label class="form-label" for="timer-custom-input">自訂分鐘數</label>
          <div class="timer-custom-row">
            <input id="timer-custom-input" class="felt-input" type="number" min="1" max="120" value="5" />
            <span style="font-weight:800; white-space:nowrap;">分鐘</span>
          </div>
          <div class="timer-action-row">
            <button type="button" id="timer-start-btn" class="btn-3d timer-big-btn">開始倒數</button>
            <button type="button" id="timer-pause-btn" class="btn-3d timer-big-btn secondary">暫停</button>

        </div>
      </div>

  <!-- ==================== SETTINGS MODAL ==================== -->
  <div id="settings-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="settings-modal-title" class="modal-title">⚙️ 班級平台設定</h3>
        <button type="button" class="btn-3d modal-close" data-close-modal="settings-modal" aria-label="關閉">✕</button>
      </div>

      <div class="modal-tabs" role="tablist">
        <button type="button" class="btn-3d modal-tab-btn active" data-stab="tasks">任務清單</button>
        <button type="button" class="btn-3d modal-tab-btn" data-stab="class">班級與組別</button>
        <button type="button" class="btn-3d modal-tab-btn" data-stab="quiet">安靜挑戰</button>
        <button type="button" class="btn-3d modal-tab-btn" data-stab="images">自訂企鵝圖片</button>
      </div>

      <div class="modal-body">
        <!-- Tab 1: Edit Tasks -->
        <div id="stab-tasks" class="tab-pane active">
          <div class="form-section">
            <div style="display:flex; gap:8px; margin-bottom:12px;">
              <button type="button" class="btn-3d small-action-btn neutral task-mode-switch" data-edit-mode="lunch">午膳</button>
              <button type="button" class="btn-3d small-action-btn neutral task-mode-switch" data-edit-mode="reading">早讀</button>
              <button type="button" class="btn-3d small-action-btn task-mode-switch" data-edit-mode="class">課堂</button>
            </div>
            <div id="task-editor-list"></div>
            <div style="display:flex; gap:8px; margin-top:10px;">
              <input id="new-task-input" class="felt-input" type="text" placeholder="輸入新任務內容..." />
              <button type="button" id="add-task-btn" class="btn-3d small-action-btn">新增任務</button>
            </div>
          </div>
        </div>

        <!-- Tab 2: Class & Groups -->
        <div id="stab-class" class="tab-pane">
          <div class="form-section">
            <label class="form-label" for="student-count-range">「摘名版面」學生總人數（20 至 40 人）</label>
            <div class="range-row">
              <input id="student-count-range" type="range" min="20" max="40" value="30" />
              <span id="student-count-val" class="range-value">30 人</span>
            </div>
          </div>

          <div class="form-section">
            <span class="form-label">六組名稱設定</span>
            <div id="group-name-inputs" class="group-name-grid"></div>
          </div>
        </div>

        <!-- Tab 3: Quiet Challenge Sensitivity & Simulator -->
        <div id="stab-quiet" class="tab-pane">
          <div class="form-section">
            <label class="form-label" for="mic-device-select">選擇收音咪高峰裝置</label>
            <select id="mic-device-select" class="felt-input">
              <option value="">系統預設咪高峰</option>
            </select>
          </div>
          <div class="form-section">
            <label class="form-label" for="noise-threshold-range">觸發企鵝驚醒的音量門檻（數值越低越敏感）</label>
            <div class="range-row">
              <input id="noise-threshold-range" type="range" min="15" max="90" value="55" />
              <span id="noise-threshold-val" class="range-value">55</span>
            </div>
          </div>

          <div class="form-section">
            <label class="form-label" for="sim-volume-range">模擬音量測試滑桿（無需咪高峰亦可測試企鵝反應）</label>
            <div class="range-row">
              <input id="sim-volume-range" type="range" min="0" max="100" value="0" />
              <span id="sim-volume-val" class="range-value">0</span>
            </div>
            <p style="margin:8px 0 0; font-size:13px; color:#adc4de;">
              拖動此滑桿超過門檻即可即時觸發企鵝驚醒；拉回低於門檻並保持 2 秒，企鵝會自動變回睡覺狀態。
            </p>
          </div>
        </div>

        <!-- Tab 4: Custom Penguin Images -->
        <div id="stab-images" class="tab-pane">
          <div class="form-section">
            <span class="form-label">上傳本地圖片替換企鵝外觀（自動壓縮並儲存於本機）</span>
            <div id="custom-image-grid" class="upload-grid"></div>
          </div>
        </div>

      /* ==================== SOUND EFFECTS (Web Audio API) ==================== */
      let sharedAudioCtx = null;
      function getAudioCtx() {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        if (!sharedAudioCtx) sharedAudioCtx = new Ctx();
        if (sharedAudioCtx.state === 'suspended') {
          sharedAudioCtx.resume().catch(() => {});
        }
        return sharedAudioCtx;
      }

      function playPopSound(pitch = 560) {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(pitch * 1.45, now + 0.09);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      }

      function playCheerSound() {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.5];
        const now = ctx.currentTime;
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          const start = now + idx * 0.09;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.001, start);
          gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.42);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.45);
        });
      }

      function playGentleChime() {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const notes = [659.25, 880, 659.25, 880];
        const now = ctx.currentTime;
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          const t = now + i * 0.22;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.16, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.36);
        });
      }

              <ellipse cx="75" cy="108" rx="47" ry="17" fill="#69d4f2" stroke="#070e18" stroke-width="2.6"/>
              <path d="M35 107 Q75 123 115 107" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.88"/>
